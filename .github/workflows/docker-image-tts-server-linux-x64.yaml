name: docker-image-tts-server-linux-x64

on:
  # 独立 TTS 服务镜像：仅手动触发，或在打 vtts-1.13.7 tag 时触发。
  # 使用独立 tag 以免复用 v1.13.7 时连带重跑 OpenVINO ASR 镜像的构建。
  push:
    tags:
      - 'vtts-1.13.7'
  workflow_dispatch:

concurrency:
  group: docker-image-tts-server-linux-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sherpa-onnx TTS server image (Linux x64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/scripts/tts-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sherpa-tts-server:1.13.7
            ghcr.io/${{ github.repository_owner }}/sherpa-tts-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max