name: docker-image-openvino-linux-x64

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/openvino/Dockerfile'
      - '.github/workflows/docker-image-openvino-linux-x64.yaml'
      - 'sherpa-onnx/csrc/provider.h'
      - 'sherpa-onnx/csrc/provider.cc'
      - 'sherpa-onnx/csrc/provider-config.cc'
      - 'sherpa-onnx/csrc/session.cc'
    tags:
      - 'v1.13.6'
  workflow_dispatch:

concurrency:
  group: docker-image-openvino-linux-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sherpa-onnx OpenVINO image (Linux x64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/scripts/openvino/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sherpa-onnx-openvino:1.13.6
            ghcr.io/${{ github.repository_owner }}/sherpa-onnx-openvino:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max