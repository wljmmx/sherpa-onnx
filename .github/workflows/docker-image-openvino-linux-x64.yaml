name: docker-image-openvino-linux-x64

on:
  # 仅手动触发，或在打 v1.13.6 tag 时触发。
  # 不监听 push：仓库 fork 自 sherpa-onnx，push 会连带触发上游全部测试 workflow，
  # 挤占免费 runner 并发导致排队长达数小时。
  push:
    tags:
      - 'v1.13.6'
  workflow_dispatch:

concurrency:
  group: docker-image-openvino-linux-x64
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sherpa-onnx OpenVINO image (Linux x64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/scripts/openvino/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sherpa-onnx-openvino:1.13.6
            ghcr.io/${{ github.repository_owner }}/sherpa-onnx-openvino:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max